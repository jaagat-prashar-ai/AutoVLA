name: qwen2.5-vl-3B-nuplan-cluster-pilot-eval
description: >
  Same model as qwen2.5-vl-3B-nuplan-navtest-eval.yaml, but with
  pretrained_model_path switched from an NFS path (unreachable on a Lilypad
  cluster node -- confirmed via a real run's ModuleNotFoundError/AssertionError
  failures) to the public HF repo id, auto-downloaded via HF_TOKEN.
  sft_model_path is a placeholder; tools/preprocessing/generate_counterfactual_cot.py's
  --sft_checkpoint_override always takes precedence (autovla_lilypad/run.py
  downloads Zewei-Zhou/AutoVLA's AutoVLA_PDMS_89.ckpt from HF hub to a local
  path and passes it via that flag).

model:
  use_cot: true
  pretrained_model_path: Qwen/Qwen2.5-VL-3B-Instruct
  sft_model_path: /mnt/work/autovla_counterfactual_pilot/AutoVLA_PDMS_89.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory: # future trajectory parameters
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens: # action token parameters, depends on the pretrained large model
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

inference:
  batch_size: 1
  num_workers: 1
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0.0
    top_p: 1.0

name: qwen2.5-vl-3B-nuplan-navtest-eval
description: AutoVLA (Qwen2.5-VL-3B) navtest PDM-Score evaluation config, pointed at the HF AutoVLA_PDMS_89 checkpoint and NFS-mirrored navtest data

model:
  use_cot: true
  pretrained_model_path: /media/training_data/jaagat-prashar/navsim_autovla_eval/models/Qwen2.5-VL-3B-Instruct
  sft_model_path: /media/training_data/jaagat-prashar/navsim_autovla_eval/checkpoints/AutoVLA_PDMS_89.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory: # future trajectory parameters
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens: # action token parameters, depends on the pretrained large model
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

data:
  val:
    path: /media/training_data/ishaan.rawal/navsim/dataset/placeholder/test
    scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
    metric_cache_path: /media/training_data/jaagat-prashar/navsim_autovla_eval/dataset/nuplan/navtest_metric_cache
    json_dataset_path: /media/training_data/jaagat-prashar/navsim_autovla_eval/dataset/nuplan/navtest_nocot
    sensor_data_path: /media/training_data/ishaan.rawal/navsim/dataset/sensor_blobs/test

inference:
  batch_size: 1
  num_workers: 1
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0.0
    top_p: 1.0
